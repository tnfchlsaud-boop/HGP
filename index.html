<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f172a"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="HGP 통합 보고"><link rel="apple-touch-icon" href="icon-180.png"><link rel="manifest" href="manifest.webmanifest"><title>HGP 통합 보고</title><style>
:root{--bg:#f1f5f9;--ink:#0f172a;--muted:#94a3b8;--accent:#2563eb}*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:var(--ink)}.app{height:100%;max-width:820px;margin:auto;display:flex;flex-direction:column;padding:10px 8px 0}.top{background:#0f172a;color:#fff;border-radius:18px;padding:13px 14px 12px;margin-bottom:8px;display:flex;align-items:center;gap:12px}.top img{width:54px;height:54px;border-radius:13px;box-shadow:0 2px 8px #0006}.title{flex:1}.title h1{font-size:20px;margin:0 0 3px}.title p{margin:0;color:#cbd5e1;font-size:12px}.ver{font-size:12px;font-weight:900;color:#93c5fd}.sites{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:8px}.site{border:0;border-radius:13px;background:#fff;padding:11px 5px;font-weight:900;color:#475569;box-shadow:0 1px 4px #00000012;font-size:15px}.site.active{background:var(--accent);color:#fff}.site.seo.active{background:#059669}.framewrap{flex:1;min-height:0;border-radius:16px 16px 0 0;overflow:hidden;background:#fff;box-shadow:0 1px 5px #0001}iframe{display:block;width:100%;height:100%;border:0;background:var(--bg)}@media(min-width:700px){.app{padding:14px 12px 0}.top{padding:16px}.top img{width:62px;height:62px}}
</style></head><body><div class="app"><header class="top"><img src="icon-192.png" alt=""><div class="title"><h1>HGP 통합 보고 <span class="ver">v5</span></h1><p>동충주 · 서충주 보고 통합 관리</p></div></header><nav class="sites"><button id="dong" class="site">동충주</button><button id="seo" class="site seo">서충주</button></nav><div class="framewrap"><iframe id="appFrame" title="HGP 보고 앱"></iframe></div></div><script>
const frame=document.getElementById('appFrame'),buttons=[document.getElementById('dong'),document.getElementById('seo')];function openSite(site){localStorage.setItem('hgpUnifiedLastSite',site);buttons.forEach(b=>b.classList.toggle('active',b.id===site));frame.src=site==='seo'?'seo.html':'dong.html'}buttons.forEach(b=>b.onclick=()=>openSite(b.id));openSite(localStorage.getItem('hgpUnifiedLastSite')||'seo');if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
